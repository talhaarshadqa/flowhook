[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowhook"
version = "1.0.0"
description = "A small webhook-driven automation engine: triggers, filters and actions as JSON flows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Talha Arshad" }]
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.5"]

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
dev = ["pytest>=7", "pytest-cov", "httpx>=0.27", "ruff"]

[project.scripts]
flowhook = "flowhook.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
